name: Publish LeoSpace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved release
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reassemble approved archive
        run: cat leospace-pages-corraxium-20261117.zip.part01 leospace-pages-corraxium-20261117.zip.part02 leospace-pages-corraxium-20261117.zip.part03 leospace-pages-corraxium-20261117.zip.part04 > leospace-pages-corraxium-20261117.zip
      - name: Verify approved archives
        run: |
          echo '3185bf5f8de3b84de5018235969d639caad08210965c430da40c01eabe67f1c4  leospace-pages-corraxium-20261117.zip' | sha256sum --check
          echo '806def5ae966b237d3bbd896e10edf1ad9a99f855f5feae9b15a65f31e7bbae7  leospace-pages-vkusnye-kartochki-20261122.zip' | sha256sum --check
      - name: Extract static site
        run: |
          mkdir _site
          unzip -q leospace-pages-corraxium-20261117.zip -d _site
          unzip -oq leospace-pages-vkusnye-kartochki-20261122.zip -d _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
