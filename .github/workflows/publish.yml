name: Publish LeoSpace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved release
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify approved archive
        run: echo 'dd3d31a8a32254b9ff7ebbee58650d11d53710bb1bdc0e88f8106a4405a7429b  leospace-pages-wallpapermaster-20261127.zip' | sha256sum --check
      - name: Extract static site
        run: unzip -q leospace-pages-wallpapermaster-20261127.zip -d _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
