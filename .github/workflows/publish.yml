name: Publish LeoSpace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved release
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify approved archive
        run: echo 'dd3d31a8a32254b9ff7ebbee58650d11d53710bb1bdc0e88f8106a4405a7429b  leospace-pages-wallpapermaster-20261127.zip' | sha256sum --check
      - name: Extract static site
        run: unzip -q leospace-pages-wallpapermaster-20261127.zip -d _site
      - name: Verify recipe update archives
        run: |
          echo '8dcc83f460dcdf61df1c79c6f828b8ea41e81d86c48fbd4a74a8133518624dea  vkusnye-kartochki-20261127-part1.zip' | sha256sum --check
          echo '1d6f5f07f214ee140f33719569be9969df9735195b64400b2fe813961de8b347  vkusnye-kartochki-20261127-part2.zip' | sha256sum --check
      - name: Apply recipe update
        run: |
          unzip -oq vkusnye-kartochki-20261127-part1.zip -d _site
          unzip -oq vkusnye-kartochki-20261127-part2.zip -d _site
      - name: Apply illustrated recipe view
        run: |
          echo 'e0e25a7797e01426905f7112e8c05d3874b8cddbc083c769e10cecdbdfbdbf14  vkusnye-kartochki-poster-view-20261127.zip' | sha256sum --check
          unzip -oq vkusnye-kartochki-poster-view-20261127.zip -d _site
      - name: Apply program downloads and launch update
        run: |
          echo '246557b7ca7693a6a32d77cfcac0327dad2b1a8b77addb09828b6b83c4a7a804  leospace-pages-downloads-launch-20261128.zip' | sha256sum --check
          unzip -oq leospace-pages-downloads-launch-20261128.zip -d _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
